<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA con Audio</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1d; color: white; }
        .captcha-container { background: #2c2c30; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 320px; }
        
        /* Contenedor visual del Captcha */
        .captcha-visual-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; gap: 10px; }
        #captchaImage { background-color: #000; border-radius: 5px; overflow: hidden; flex-grow: 1; height: 80px; display: flex; align-items: center;}
        #captchaImage img { width: 100%; height: auto; display: block; }
        
        /* Botones de acción */
        .captcha-actions { display: flex; flex-direction: column; gap: 8px; }
        .action-btn { background: #444; border: none; color: white; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 1.2em; transition: background 0.2s; }
        .action-btn:hover { background: #555; }
        
        /* Input y Validación */
        #captchaAnswer { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #444; background: #1a1a1d; color: white; font-size: 1.1em; box-sizing: border-box; }
        #validateBtn { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        #validateBtn:hover { background: #0056b3; }
        #status { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="captcha-container">
    <h3>Verificación de Seguridad</h3>
    
    <div class="captcha-visual-row">
        <div id="captchaImage">
            </div>
        <div class="captcha-actions">
            <button type="button" class="action-btn" id="reloadCaptcha" title="Cambiar código">🔄</button>
            <button type="button" class="action-btn" id="playAudio" title="Escuchar código">🔊</button>
        </div>
    </div>

    <input type="text" id="captchaAnswer" placeholder="Introduce el código" autocomplete="off" maxlength="6">
    <button type="button" id="validateBtn">Verificar</button>
    
    <div id="status"></div>
</div>

<script>
/**
 * CAPTCHA
 * Enfocado en: Criptografía, Legibilidad Humana, Anti-OCR y Accesibilidad (Audio).
 */
const CaptchaEngine = (() => {
    
    // 1. CONFIGURACIÓN
    // Eliminamos caracteres ambiguos: 0/O, 1/I/l, etc.
    const ALLOWED_CHARACTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const CAPTCHA_LENGTH = 6;
    const CANVAS_WIDTH = 280;
    const CANVAS_HEIGHT = 80;

    // Estado interno
    let currentCaptchaText = '';
    let isSpeaking = false;

    // 2. UTILIDADES DE SEGURIDAD (CRIPTOGRAFÍA)
    // Generación de números aleatorios criptográficamente seguros
    function getSecureRandomInt(min, max) {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return min + (array[0] % (max - min + 1));
    }

    function generateSecureText(length) {
        let text = '';
        for (let i = 0; i < length; i++) {
            text += ALLOWED_CHARACTERS[getSecureRandomInt(0, ALLOWED_CHARACTERS.length - 1)];
        }
        return text;
    }

    // 3. LÓGICA VISUAL (CANVAS)
    function drawCaptcha(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // A. Fondo: Gradiente oscuro complejo para dificultar la segmentación
        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, `hsl(${getSecureRandomInt(0, 360)}, 30%, 10%)`);
        gradient.addColorStop(1, `hsl(${getSecureRandomInt(0, 360)}, 20%, 20%)`);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // B. Interferencia de fondo (Líneas y Círculos sutiles)
        ctx.globalAlpha = 0.2; // Muy sutil
        for (let i = 0; i < 15; i++) {
            ctx.beginPath();
            ctx.strokeStyle = `hsl(${getSecureRandomInt(0, 360)}, 70%, 80%)`;
            ctx.lineWidth = getSecureRandomInt(1, 2);
            ctx.moveTo(getSecureRandomInt(0, canvas.width), getSecureRandomInt(0, canvas.height));
            ctx.bezierCurveTo(
                getSecureRandomInt(0, canvas.width), getSecureRandomInt(0, canvas.height),
                getSecureRandomInt(0, canvas.width), getSecureRandomInt(0, canvas.height),
                getSecureRandomInt(0, canvas.width), getSecureRandomInt(0, canvas.height)
            );
            ctx.stroke();
        }
        ctx.globalAlpha = 1.0; // Reset

        // C. Dibujo del Texto Distorsionado
        const charArray = text.split('');
        const fonts = ['extrabold 40px "Segoe UI", Roboto', 'bold 42px Georgia', '900 38px Verdana'];
        
        charArray.forEach((char, i) => {
            ctx.save();

            // Posición base (con ligera aleatoriedad)
            const x = 30 + i * (CANVAS_WIDTH / (CAPTCHA_LENGTH + 1)) + getSecureRandomInt(-3, 3);
            const y = CANVAS_HEIGHT / 1.5 + getSecureRandomInt(-5, 5);

            // Transformaciones: Rotación y Escalado
            ctx.translate(x, y);
            ctx.rotate((getSecureRandomInt(-15, 15) * Math.PI) / 180); // Rotación en radianes
            
            // Estilo del texto
            ctx.font = fonts[getSecureRandomInt(0, fonts.length - 1)];
            
            // Color Neón con alto contraste vs fondo
            const hue = getSecureRandomInt(0, 360);
            ctx.fillStyle = `hsl(${hue}, 90%, 70%)`;
            
            // Sombra para efecto neón y anti-OCR
            ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.8)`;
            ctx.shadowBlur = getSecureRandomInt(8, 15);
            
            ctx.fillText(char, 0, 0);
            ctx.restore();
        });

        // D. Interferencia de primer plano (Líneas de corte)
        // Estas líneas "cortan" las letras dificultando al OCR unirlas.
        ctx.globalAlpha = 0.4;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.moveTo(0, getSecureRandomInt(20, CANVAS_HEIGHT - 20));
            ctx.lineTo(CANVAS_WIDTH, getSecureRandomInt(20, CANVAS_HEIGHT - 20));
            ctx.stroke();
        }

        return canvas.toDataURL('image/png');
    }

    // 4. LÓGICA DE AUDIO (ACCESIBILIDAD)
    function playAudioCaptcha() {
        if (!('speechSynthesis' in window) || isSpeaking || !currentCaptchaText) return;

        isSpeaking = true;
        const btn = document.getElementById('playAudio');
        btn.textContent = '⏳'; // Feedback visual de carga

        // Deletrear el texto. Separamos por comas y añadimos puntos para dar pausas.
        const textToSpeak = currentCaptchaText.split('').join(', ').toLowerCase();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        
        // Configuración de la voz
        utterance.lang = 'es-ES'; // O 'en-US' según tu público
        utterance.rate = 0.8;    // Un poco más lento para que se entienda bien
        utterance.pitch = 1;

        // Eventos de finalización
        utterance.onend = () => {
            isSpeaking = false;
            btn.textContent = '🔊';
        };
        utterance.onerror = () => {
            isSpeaking = false;
            btn.textContent = '🔊';
            console.error('Error en SpeechSynthesis');
        };

        // Un pequeño hack para asegurar que funcione en algunos navegadores móviles:
        // SpeechSynthesis debe ser iniciado por una acción del usuario directa.
        window.speechSynthesis.cancel(); 
        window.speechSynthesis.speak(utterance);
    }

    // 5. FLUJO PÚBLICO
    function refresh() {
        // Limpiar audio si estaba sonando
        window.speechSynthesis.cancel();
        isSpeaking = false;
        document.getElementById('playAudio').textContent = '🔊';

        // Generar nuevo texto seguro
        currentCaptchaText = generateSecureText(CAPTCHA_LENGTH);
        
        // Generar imagen y colocarla
        const imgData = drawCaptcha(currentCaptchaText);
        const container = document.getElementById('captchaImage');
        if (container) {
            container.innerHTML = `<img src="${imgData}" alt="Código CAPTCHA de seguridad">`;
        }

        // Limpiar input
        const input = document.getElementById('captchaAnswer');
        if (input) input.value = '';
        
        // Limpiar estado
        const status = document.getElementById('status');
        if(status) { status.textContent = ''; status.style.color = 'white';}

        //console.log("Dev Cheat:", currentCaptchaText); // Descomenta para debugear
    }

    function validate() {
        const userAnswer = document.getElementById('captchaAnswer').value.trim().toUpperCase();
        const status = document.getElementById('status');

        if (!userAnswer) {
            status.textContent = 'Por favor, introduce el código.';
            status.style.color = '#ffc107';
            return;
        }

        if (userAnswer === currentCaptchaText) {
            status.textContent = '¡Verificación exitosa! Eres humano.';
            status.style.color = '#28a745';
            // Aquí enviarías el formulario o harías la acción siguiente
        } else {
            status.textContent = 'Código incorrecto. Inténtalo de nuevo.';
            status.style.color = '#dc3545';
            refresh(); // Refrescar automáticamente si falla
        }
    }

    return {
        init: () => {
            refresh();
            // Asignar eventos
            document.getElementById('reloadCaptcha').addEventListener('click', refresh);
            document.getElementById('playAudio').addEventListener('click', playAudioCaptcha);
            document.getElementById('validateBtn').addEventListener('click', validate);
            
            // Permitir validar con "Enter" en el input
            document.getElementById('captchaAnswer').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') validate();
            });
        }
    };
})();

// Iniciar cuando el DOM esté listo
document.addEventListener('DOMContentLoaded', CaptchaEngine.init);

</script>
</body>
</html>
